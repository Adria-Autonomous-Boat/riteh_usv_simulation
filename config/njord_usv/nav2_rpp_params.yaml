planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_theta_star_planner::ThetaStarPlanner"
      tolerance: 0.125
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 1.5            # Slightly faster than A*

      smoother:
        max_iterations: 200             # Minimal smoothing (Theta* already produces direct paths)
        w_smooth: 0.08                  # Lower = preserve direct path
        w_data: 0.52                    # Higher = stay closer to original
        tolerance: 1.0e-8

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True
      refinement_num: 2
      enforce_path_inversion: False
      w_data: 0.2
      w_smooth: 0.3

