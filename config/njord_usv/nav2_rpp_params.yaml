lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True
    autostart: True
    node_names: ['controller_server',
                 'smoother_server',
                 'planner_server',
                 'behavior_server',
                 'bt_navigator',
                 'waypoint_follower',
                 'velocity_smoother',
                 'collision_monitor']

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 2.0
      yaw_goal_tolerance: 6.28
      stateful: True
    
    FollowPath:
      #plugin: "nav2_rotation_shim_controller::RotationShimController"
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # RotationShimController settings
      # angular_dist_threshold: 0.349066
      # forward_sampling_distance: 1.0
      # angular_disengage_threshold: 0.174533
      # rotate_to_heading_angular_vel: 1.0
      # max_angular_accel: 1.2
      # simulate_ahead_time: 2.0
      # rotate_to_goal_heading: false

      # RegulatedPurePursuitController settings
      desired_linear_vel: 1.0
      lookahead_dist: 3.0

      use_velocity_scaled_lookahead_dist: false
      min_lookahead_dist: 2.5
      max_lookahead_dist: 8.0
      lookahead_time: 2.0

      # Use this or RotationShimController
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 1.2

      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.2
      approach_velocity_scaling_dist: 0.0 # The distance (m) left on the path at which to start slowing down

      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 2.0 # use_collision_detection must be true

      use_cost_regulated_linear_velocity_scaling: false # Whether to use the regulated features for proximity to obstacles
      cost_scaling_dist: 5.0 # The minimum distance from an obstacle to trigger the scaling of linear velocity, if use_cost_regulated_linear_velocity_scaling is enabled. The value set should be smaller or equal to the inflation_radius set in the inflation layer of costmap, since inflation is used to compute the distance from obstacles.
      cost_scaling_gain: 0.7 # A multiplier gain, which should be <= 1.0, used to further scale the speed when an obstacle is within cost_scaling_dist. Lower value reduces speed more quickly.

      use_regulated_linear_velocity_scaling: false # Whether to use the regulated features for curvature
      regulated_linear_scaling_min_radius: 3.0 # use_regulated_linear_velocity_scaling must be true
      regulated_linear_scaling_min_speed: 0.3

      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 5.0

      allow_reversing: false

# Rolling local costmap: STVL replaces nav2_costmap_2d::VoxelLayer.
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      unknown_is_lethal: false
      rolling_window: true
      width: 35
      height: 35
      track_unknown_space: false
      resolution: 0.1
      robot_radius: 0.8
      plugins: ["stvl_layer", "inflation_layer"]

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 0.5
        decay_model: 0
        voxel_size: 0.10
        track_unknown_space: false
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.3
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: livox_mark livox_clear

        livox_mark:
          enabled: true
          data_type: "PointCloud2"
          topic: "/sensors/livox_lidar/scan"
          marking: true
          clearing: false
          min_obstacle_height: -0.5
          max_obstacle_height: 3.0
          obstacle_range: 40.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          clear_after_reading: true
          filter: "voxel"
          voxel_min_points: 0

        livox_clear:
          enabled: true
          data_type: "PointCloud2"
          topic: "/sensors/livox_lidar/scan"
          marking: false
          clearing: true
          min_z: -0.5
          max_z: 3.0
          clear_after_reading: true
          vertical_fov_angle: 0.5236
          horizontal_fov_angle: 6.2832
          decay_acceleration: 30.0
          model_type: 1

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.2

      always_send_full_costmap: True
      transform_tolerance: 0.3

# Rolling global costmap: STVL replaces nav2_costmap_2d::ObstacleLayer.
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      unknown_is_lethal: false
      robot_radius: 0.8
      resolution: 0.2
      rolling_window: true
      width: 100
      height: 100
      track_unknown_space: false
      plugins: ["stvl_layer", "inflation_layer"]

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 0.2
        decay_model: 0
        voxel_size: 0.20
        track_unknown_space: false
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.3
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: livox_mark livox_clear

        livox_mark:
          enabled: true
          data_type: "PointCloud2"
          topic: "/sensors/livox_lidar/scan"
          marking: true
          clearing: false
          min_obstacle_height: -0.5
          max_obstacle_height: 3.0
          obstacle_range: 40.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          clear_after_reading: true
          filter: "voxel"
          voxel_min_points: 0

        livox_clear:
          enabled: true
          data_type: "PointCloud2"
          topic: "/sensors/livox_lidar/scan"
          marking: false
          clearing: true
          min_z: -0.5
          max_z: 3.0
          clear_after_reading: true
          vertical_fov_angle: 0.18
          horizontal_fov_angle: 6.2832
          decay_acceleration: 5.0
          model_type: 1

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.2
      always_send_full_costmap: True
      transform_tolerance: 0.3

